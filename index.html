<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BioCode-X — Countdown</title>
<meta name="description" content="BioCode-X, the flagship bioinformatics hackathon. Live round countdown." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#040908;
    --bg-2:#06110d;
    --panel:#0a1512;
    --line:rgba(120,255,205,.10);
    --line-strong:rgba(120,255,205,.22);
    --green:#3df5a5;
    --green-soft:#57caa0;
    --green-dim:#2b8f6e;
    --teal:#4fd4d0;
    --muted:#6f8a80;
    --muted-2:#4a6058;
    --white:#ffffff;
    --glow:0 0 26px rgba(61,245,165,.30), 0 0 4px rgba(61,245,165,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% 8%, #08150f 0%, var(--bg) 62%),
      var(--bg);
    color:var(--white);
    font-family:"Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100dvh;
    overflow-x:hidden;
  }
  /* faint sequence watermark, grounds it in bioinformatics without stealing focus */
  body::before{
    content:"ACGTACGTGGCATTACGATCGGATCCACGTAGCTAGGCATACGTTACGGATCACGTAGCTAGGCATACGTTAC";
    position:fixed;
    top:0;left:50%;transform:translateX(-50%);
    width:200vw;
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;letter-spacing:.55em;line-height:1;
    color:rgba(120,255,205,.035);
    white-space:nowrap;overflow:hidden;
    pointer-events:none;user-select:none;
    padding-top:2px;
  }

  header.topbar{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    grid-template-areas:"l c r";
    align-items:center;
    gap:clamp(10px,3vw,28px);
    padding:20px clamp(16px,5vw,48px);
    border-bottom:1px solid var(--line);
  }
  .side{display:flex;align-items:center;}
  .side.left{grid-area:l;justify-self:start;}
  .side.right{grid-area:r;justify-self:end;}
  .collab{
    grid-area:c;justify-self:center;
    display:flex;align-items:center;gap:clamp(8px,2vw,16px);
  }
  /* the "×" that binds the two collaborating orgs into one lockup */
  .cross{
    font-family:"IBM Plex Mono",monospace;font-weight:500;
    font-size:clamp(1rem,3.4vw,1.5rem);
    color:var(--green);text-shadow:var(--glow);
    opacity:.9;line-height:1;user-select:none;
  }
  .chip{
    background:var(--white);
    border-radius:12px;
    padding:9px 14px;
    display:flex;align-items:center;
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 8px 30px rgba(0,0,0,.45);
  }
  .chip img{display:block;height:30px;width:auto;}
  .chip.genova img{height:38px;}
  .chip.srm img{height:46px;}
  /* YUVA is white-on-transparent, so it sits straight on the dark bg (no chip) */
  .logo.yuva{display:flex;align-items:center;}
  .logo.yuva img{
    display:block;height:30px;width:auto;
    filter:drop-shadow(0 0 14px rgba(120,255,205,.16));
  }
  @media (max-width:640px){
    header.topbar{
      grid-template-columns:1fr 1fr;
      grid-template-areas:"l r" "c c";
      row-gap:14px;
    }
    .collab{margin-top:2px;}
  }

  main{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:clamp(28px,6vw,64px) 20px;
    gap:6px;
  }

  .title{
    font-weight:700;
    font-size:clamp(2.1rem,7vw,3.6rem);
    letter-spacing:-.01em;
    margin:0;
    line-height:1;
  }
  .title .x{color:var(--green);text-shadow:var(--glow);}
  .tagline{
    margin:12px 0 0;
    color:var(--muted);
    font-size:clamp(.82rem,2.4vw,1.02rem);
    font-weight:400;
    letter-spacing:.14em;
  }

  .hero{
    margin-top:clamp(30px,6vw,54px);
    display:flex;flex-direction:column;align-items:center;gap:18px;
    opacity:0;transform:translateY(8px);
    animation:rise .7s ease-out .05s forwards;
  }
  @keyframes rise{to{opacity:1;transform:none;}}

  .status{
    display:inline-flex;align-items:center;gap:9px;
    padding:7px 15px 7px 12px;
    border:1px solid var(--line-strong);
    border-radius:999px;
    font-family:"IBM Plex Mono", monospace;
    font-size:.74rem;letter-spacing:.14em;
    color:var(--green-soft);
    background:rgba(61,245,165,.05);
  }
  .status .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--green);box-shadow:0 0 10px var(--green);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .status[data-state="armed"]{color:var(--teal);border-color:rgba(79,212,208,.28);background:rgba(79,212,208,.05);}
  .status[data-state="armed"] .dot{background:var(--teal);box-shadow:0 0 10px var(--teal);animation:none;}
  .status[data-state="done"]{color:var(--muted);border-color:var(--line);background:transparent;}
  .status[data-state="done"] .dot{background:var(--muted-2);box-shadow:none;animation:none;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.78);}}

  .clock{
    display:flex;align-items:flex-start;justify-content:center;
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    line-height:.9;
    color:var(--green);
    text-shadow:var(--glow);
  }
  .clock .grp{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .clock .num{
    font-weight:600;
    font-size:clamp(2.3rem,10.5vw,6.4rem);
    letter-spacing:.01em;
  }
  .clock .unit{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(.6rem,1.9vw,.8rem);
    letter-spacing:.32em;
    color:var(--green-dim);
    text-shadow:none;
    font-weight:500;
    padding-left:.32em;
  }
  .clock .sep{
    font-weight:500;
    font-size:clamp(1.7rem,7.5vw,4.4rem);
    color:var(--green-dim);
    opacity:.7;
    padding:0 clamp(3px,1vw,11px);
    line-height:1;
  }
  /* armed (not yet running) reads cooler + calmer */
  .clock.armed{color:var(--teal);text-shadow:0 0 22px rgba(79,212,208,.22);}
  .clock.armed .sep{color:var(--teal);}
  .clock.armed .unit{color:#2f8f8c;}
  .clock.done{color:var(--muted);text-shadow:none;}
  .clock.done .sep,.clock.done .unit{color:var(--muted-2);}

  .whenline{
    margin-top:4px;
    color:var(--muted);
    font-family:"IBM Plex Mono",monospace;
    font-size:.82rem;letter-spacing:.04em;
  }

  /* round rail */
  .rail{
    display:flex;flex-wrap:wrap;gap:14px;justify-content:center;
    margin-top:clamp(34px,7vw,60px);
    width:100%;max-width:720px;
  }
  .round{
    flex:1 1 240px;max-width:340px;
    border:1px solid var(--line);
    border-radius:14px;
    background:linear-gradient(180deg, rgba(255,255,255,.015), rgba(0,0,0,0));
    padding:16px 18px;
    text-align:left;
    display:flex;flex-direction:column;gap:8px;
  }
  .round.active{border-color:var(--line-strong);box-shadow:0 0 0 1px rgba(61,245,165,.12), 0 18px 50px -30px rgba(61,245,165,.5);}
  .round .rname{
    font-weight:600;font-size:1.02rem;letter-spacing:.01em;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .tag{
    font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.16em;
    padding:4px 9px;border-radius:999px;border:1px solid var(--line-strong);
    color:var(--green-soft);white-space:nowrap;
  }
  .tag[data-state="armed"]{color:var(--teal);border-color:rgba(79,212,208,.28);}
  .tag[data-state="done"]{color:var(--muted);border-color:var(--line);}
  .round .rmeta{
    font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--muted);letter-spacing:.02em;line-height:1.5;
  }
  .round .rdur{color:var(--green-soft);}
  .round.armedcard .rdur{color:var(--teal);}
  .round.donecard .rdur{color:var(--muted-2);}

  footer{
    padding:18px 20px 26px;
    text-align:center;
    color:var(--muted-2);
    font-family:"IBM Plex Mono",monospace;
    font-size:.72rem;letter-spacing:.06em;
    border-top:1px solid var(--line);
  }
  footer b{color:var(--green-dim);font-weight:500;}

  @media (max-width:520px){
    .chip.genova img{height:30px;}
    .chip img{height:24px;}
    .chip.srm img{height:38px;}
    .logo.yuva img{height:24px;}
    .clock .sep{padding:0 4px;}
  }
  @media (prefers-reduced-motion:reduce){
    .hero{animation:none;opacity:1;transform:none;}
    .status .dot{animation:none;}
  }
</style>
</head>

<script>
/* ============================================================
   CONFIG  —  the ONLY thing you (the organiser) edit.
   Change a time or duration here, then redeploy to Vercel.
   Times use an explicit +05:30 offset = IST. If your event is
   NOT in IST, change the offset in each startISO below AND the
   tzLabel string. Everyone worldwide will then see the clock
   hit zero at the same real instant.
   ============================================================ */
const CONFIG = {
  tzLabel: "IST",
  /* Lead-in: a LIVE countdown that runs BEFORE Round 1 and is featured at
     the top until Round 1 begins. Its target is automatically Round 1's
     start time, so the handoff is seamless (it hits 00:00:00 as R1 starts).
     - Rename it here if "Registration" is not the label you want.
     - startISO is only when it becomes visible/active (19 Sep here).
     - To instead stop the lead-in at 11:59 AM, see the note in heroPhase(). */
  leadIn: {
    name: "Registration",
    startISO: "2026-09-19T00:00:00+05:30"
  },
  rounds: [
    { name: "Round 1", startISO: "2026-09-27T12:00:00+05:30", durationHours: 30 },
    { name: "Round 2", startISO: "2026-09-29T09:30:00+05:30", durationHours: 6  }
  ]
};
/* ============================================================ */

const rounds = CONFIG.rounds.map(r => {
  const start = new Date(r.startISO);
  const end   = new Date(start.getTime() + r.durationHours * 3600 * 1000);
  return { ...r, start, end };
});

// Lead-in phase: a live countdown to Round 1's start (seamless handoff).
const leadIn = {
  ...CONFIG.leadIn,
  isLeadIn: true,
  start: new Date(CONFIG.leadIn.startISO),
  end:   rounds[0].start           // hits 00:00:00 exactly when Round 1 begins
};
const phases = [leadIn, ...rounds]; // display order in the rail, top -> bottom

const pad = n => String(n).padStart(2, "0");

function fmtWall(d){
  // e.g. "27 Sep, 12:00 PM"
  const opts = { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", hour12:true, timeZone:"Asia/Kolkata" };
  return new Intl.DateTimeFormat("en-GB", opts).format(d).replace(",", ",");
}
function fmtShort(d){
  const opts = { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", hour12:false, timeZone:"Asia/Kolkata" };
  return new Intl.DateTimeFormat("en-GB", opts).format(d);
}

function classify(r, now){
  if (now < r.start) return "armed";
  if (now < r.end)   return "live";
  return "done";
}
// remaining ms to show on the clock for a given phase+state
function remaining(r, state, now){
  if (state === "armed") {
    // lead-in counts down toward its end; rounds sit frozen at full duration
    return r.isLeadIn ? Math.max(0, r.end - now) : r.durationHours * 3600 * 1000;
  }
  if (state === "live")  return Math.max(0, r.end - now);
  return 0;
}

function hms(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  return {
    d: Math.floor(t/86400),
    h: Math.floor((t%86400)/3600),
    m: Math.floor((t%3600)/60),
    s: t%60
  };
}

const clock = document.getElementById("clock");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("statusText");
const whenline = document.getElementById("whenline");
const rail = document.getElementById("rail");
const footer = document.getElementById("footer");

function buildClock(d, h, m, s){
  clock.innerHTML =
    `<div class="grp"><span class="num">${pad(d)}</span><span class="unit">days</span></div>`+
    `<span class="sep">:</span>`+
    `<div class="grp"><span class="num">${pad(h)}</span><span class="unit">hours</span></div>`+
    `<span class="sep">:</span>`+
    `<div class="grp"><span class="num">${pad(m)}</span><span class="unit">minutes</span></div>`+
    `<span class="sep">:</span>`+
    `<div class="grp"><span class="num">${pad(s)}</span><span class="unit">seconds</span></div>`;
}

function heroPhase(now){
  // Lead-in is featured at the top until Round 1 begins; then each round
  // takes the top slot while it is current. If all rounds are finished,
  // the last one is shown (as complete).
  //   To stop the lead-in at 11:59 AM instead of a seamless 12:00 handoff,
  //   change the condition below to: now < new Date("2026-09-27T11:59:00+05:30")
  if (now >= leadIn.start && now < leadIn.end) return leadIn;
  for (const r of rounds){ if (now < r.end) return r; }
  return rounds[rounds.length - 1];
}

let lastKey = "";

function render(){
  const now = new Date();

  // ---- hero ----
  const hr = heroPhase(now);
  const hstate = classify(hr, now);
  const rem = hms(remaining(hr, hstate, now));
  buildClock(rem.d, rem.h, rem.m, rem.s);

  clock.className = "clock" + (hstate === "armed" ? " armed" : hstate === "done" ? " done" : "");
  const allDone = rounds.every(r => classify(r, now) === "done");

  const stateLabel = allDone ? "event complete"
                   : hstate === "live" ? `${hr.name.toLowerCase()} · live`
                   : hstate === "armed" ? `${hr.name.toLowerCase()} · armed`
                   : "";
  statusText.textContent = stateLabel;
  statusEl.setAttribute("data-state", allDone ? "done" : hstate);

  whenline.textContent =
      allDone           ? "thanks for building with us"
    : hr.isLeadIn       ? `round 1 starts ${fmtWall(rounds[0].start)} ${CONFIG.tzLabel}`
    : hstate === "live" ? `ends ${fmtWall(hr.end)} ${CONFIG.tzLabel}`
    :                     `starts ${fmtWall(hr.start)} ${CONFIG.tzLabel}`;

  // ---- rail (rebuild only when a state flips, to keep it cheap) ----
  const key = phases.map(p => classify(p, now)).join("|");
  if (key !== lastKey){
    lastKey = key;
    rail.innerHTML = phases.map(p => {
      const st = classify(p, now);
      const active = (p === hr && !allDone);
      const stTag = st === "live" ? "live" : st === "armed" ? "armed" : "done";
      const cls = "round" + (active ? " active" : "") + (st==="armed"?" armedcard":st==="done"?" donecard":"");
      const meta = p.isLeadIn
        ? `<span class="rdur">lead-in</span> to round 1<br>${fmtShort(p.start)} → ${fmtShort(p.end)} ${CONFIG.tzLabel}`
        : `<span class="rdur">${p.durationHours}h</span> window<br>${fmtShort(p.start)} → ${fmtShort(p.end)} ${CONFIG.tzLabel}`;
      return `<div class="${cls}">
        <div class="rname">${p.name}<span class="tag" data-state="${st}">${stTag}</span></div>
        <div class="rmeta">${meta}</div>
      </div>`;
    }).join("");
  }

  // ---- footer ----
  if (!footer.dataset.done){
    footer.dataset.done = "1";
    footer.innerHTML = `all times in <b>${CONFIG.tzLabel}</b> · your device clock: <span id="localclock"></span>`;
  }
  const lc = document.getElementById("localclock");
  if (lc) lc.textContent = now.toLocaleTimeString();
}

render();
setInterval(render, 250);
</script>
</body>
</html>
